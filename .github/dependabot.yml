# マイナー・パッチの更新はディレクトリ（エコシステム）ごとに 1 つの PR にまとめ、CI が通れば自動でマージする
# （.github/workflows/dependabot-auto-merge.yml、docs/testing.md）。メジャーの更新は個別の PR にし、人が確かめてマージする
updates:
# NuGet の版は SRC.Sharp/Directory.Packages.props の 1 か所で決める（Central Package Management）。
# SRCSharpWeb・SRCLintWeb はソリューションに入っていないため、ディレクトリを並べて対象にする（#1352）
- directories:
  - /SRC.Sharp/
  - /SRC.Sharp/SRCSharpWeb/
  - /SRC.Sharp/SRCLintWeb/
  groups:
    # SkiaSharp は管理側とネイティブ（NativeAssets.*）の版が揃っていないと起動時に失敗するため、
    # メジャーの更新も 1 つの PR にまとめる（人が確かめてマージする）。マイナー・パッチは下の nuget-minor-patch に入る
    skiasharp-major:
      patterns:
      - 'SkiaSharp*'
      update-types:
      - major
    nuget-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  package-ecosystem: nuget
  schedule:
    interval: daily
- directory: /SRC.Sharp.Help/
  groups:
    bundler-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  package-ecosystem: bundler
  schedule:
    interval: daily
- directory: /
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  package-ecosystem: github-actions
  schedule:
    interval: daily
# VS Code 拡張・SRC#Web の E2E・データビューアの E2E の npm。CI でビルド・テストしている（#1352）
- directories:
  - /SRC.Sharp/SRCSharpVSCode/
  - /SRC.Sharp/SRCSharpWeb.E2E/
  - /SRC.Sharp/SRCTestBlazor/E2E/
  groups:
    npm-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  # @types/vscode は拡張が対応する最も古い VS Code（package.json の engines.vscode）に合わせる。
  # 新しくすると vsce package が「engines.vscode より新しい」として拒む。engines.vscode を上げるときに人が上げる
  ignore:
  - dependency-name: '@types/vscode'
  package-ecosystem: npm
  schedule:
    interval: daily
version: 2

# マイナー・パッチの更新はディレクトリ（エコシステム）ごとに 1 つの PR にまとめ、CI が通れば自動でマージする
# （.github/workflows/dependabot-auto-merge.yml、docs/testing.md）。メジャーの更新は個別の PR にし、人が確かめてマージする
updates:
- directory: /SRC.Sharp/
  groups:
    # SkiaSharp は管理側とネイティブ（NativeAssets.*）の版が揃っていないと起動時に失敗するため、
    # メジャーの更新も 1 つの PR にまとめる（人が確かめてマージする）。マイナー・パッチは下の nuget-minor-patch に入る
    skiasharp-major:
      patterns:
      - 'SkiaSharp*'
      update-types:
      - major
    nuget-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  package-ecosystem: nuget
  schedule:
    interval: daily
- directory: /SRC.Sharp.Help/
  groups:
    bundler-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  package-ecosystem: bundler
  schedule:
    interval: daily
- directory: /
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  package-ecosystem: github-actions
  schedule:
    interval: daily
version: 2

name: CI

# テストの責務と、どのジョブがマージを止めるかは docs/testing.md にまとめている。
# ブランチ保護の必須チェックは、すべてのジョブの結果をまとめる ci-passed だけにする。

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # 文書だけの変更では、ビルドとテストを省く（ci-passed は省いたジョブを成功として扱う）。
  # ワークフローの paths で絞ると必須チェックが報告されずマージできなくなるため、ジョブの中で判定する
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      help: ${{ steps.filter.outputs.help }}
    steps:
    - name: Detect code changes
      id: filter
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "help=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
        echo "$files"
        # docs/・ルートの *.md・Issue のテンプレートだけなら、コードの変更は無い
        if echo "$files" | grep -qvE '^(docs/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
          echo "code=true" >> "$GITHUB_OUTPUT"
        else
          echo "code=false" >> "$GITHUB_OUTPUT"
        fi
        # ヘルプ（Jekyll のサイト）は、ヘルプかこのワークフローを変えたときだけビルドする
        if echo "$files" | grep -qE '^(SRC\.Sharp\.Help/|\.github/workflows/CI\.yml$)'; then
          echo "help=true" >> "$GITHUB_OUTPUT"
        else
          echo "help=false" >> "$GITHUB_OUTPUT"
        fi

  # 版・VS Code 拡張の版と CHANGELOG・リリースの案内（docs/releases）が揃っているか（docs/versioning.md）。
  # 案内は文書なので、文書だけの PR でも動かす
  release-check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - run: python3 tools/release.py check

  # SRCCore のユニットテストと、SRCRender の E2E・VRT（正とする環境は Linux）
  test-srccore-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet のパッケージをキャッシュする。版はすべて Directory.Packages.props にある（Central Package Management）
        cache: true
        cache-dependency-path: SRC.Sharp/Directory.Packages.props

    # VRT の基準画像は Noto Sans CJK JP で作成している
    # MIDI の合成テストには SoundFont（TimGM6mb）、カーソル移動のテストには Xvfb を使う
    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont xvfb

    - name: Test SRCCore
      run: dotnet test SRC.Sharp/SRCCoreTests/SRCCoreTests.csproj --verbosity normal

    - name: Test SRCRender (E2E / VRT)
      run: dotnet test SRC.Sharp/SRCRenderTests/SRCRenderTests.csproj --verbosity normal

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: screenshots
        path: |
          SRC.Sharp/SRCRenderTests/bin/**/TestResults/vrt/
          SRC.Sharp/SRCRenderTests/bin/**/TestResults/e2e/
        if-no-files-found: ignore

  # SRC#Avalonia・作成支援ツール・SRCSound
  test-tools-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet のパッケージをキャッシュする。版はすべて Directory.Packages.props にある（Central Package Management）
        cache: true
        cache-dependency-path: SRC.Sharp/Directory.Packages.props

    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont xvfb

    # マウスカーソルの移動（X11）を確かめるため Xvfb 上で実行する
    - name: Test SRC#Avalonia (headless)
      run: xvfb-run -a dotnet test SRC.Sharp/SRCSharpAvaloniaTests/SRCSharpAvaloniaTests.csproj --verbosity normal

    # 作成支援ツール（lint・解析・バランス集計・Language Server・デバッガ）
    - name: Test SRCAuthoring
      run: dotnet test SRC.Sharp/SRCAuthoringTests/SRCAuthoringTests.csproj --verbosity normal

    # 音声出力の無いランナーでは OpenAL Soft の null 出力を使う
    - name: Test SRCSound
      run: dotnet test SRC.Sharp/SRCSoundTests/SRCSoundTests.csproj --verbosity normal
      env:
        ALSOFT_DRIVERS: "null"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # VS Code 拡張（Language Server とデバッガのクライアント）。esbuild でまとめ、.vsix を作る
    - name: Build VS Code extension
      working-directory: SRC.Sharp/SRCSharpVSCode
      run: |
        # 拡張の版がライブラリ（srcsharp）の版と同じかは release-check で確かめる（docs/versioning.md）
        npm ci
        npm run package

    - name: Upload VS Code extension
      uses: actions/upload-artifact@v7
      with:
        name: src-vscode-vsix
        path: SRC.Sharp/SRCSharpVSCode/*.vsix

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: screenshots-avalonia
        path: SRC.Sharp/SRCSharpAvaloniaTests/bin/**/TestResults/avalonia/
        if-no-files-found: ignore

  # SRC#Web（マルチスレッドの WebAssembly と SkiaSharp のネイティブライブラリのリンクに wasm-tools が必要）
  test-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet のパッケージをキャッシュする。版はすべて Directory.Packages.props にある（Central Package Management）
        cache: true
        cache-dependency-path: SRC.Sharp/Directory.Packages.props

    # SoundFont（TimGM6mb）は MIDI を合成するテストが使う（無いとそのテストは飛ばす）
    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont

    # PR はインタープリターで発行して待ち時間を減らす（AOT は 8 分ほどかかる）。
    # master への push は公開するものと同じ AOT で発行し、E2E を通す（docs/gui/web.md）
    - name: Build SRC#Web
      run: |
        dotnet workload install wasm-tools --skip-manifest-update
        dotnet publish SRC.Sharp/SRCSharpWeb/SRCSharpWeb.csproj -c Release -o SRC.Sharp/SRCSharpWeb/bin/web -p:RunAOTCompilation=${{ github.event_name == 'pull_request' && 'false' || 'true' }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # 発行した SRC#Web を GitHub Pages と同じくサブパス（/SRC/web/）に置いて配信し、Chromium でプレイする。
    # テストは 2 並列で動かす（ランナーは 4 vCPU。3 並列では負荷で落ちるテストが出た。docs/testing.md）
    - name: Test SRC#Web (Playwright)
      working-directory: SRC.Sharp/SRCSharpWeb.E2E
      env:
        SRCWEB_ROOT: ../SRCSharpWeb/bin/pages-test
        SRCWEB_BASE: /SRC/web/
        PW_WORKERS: 2
      run: |
        mkdir -p ${SRCWEB_ROOT}${SRCWEB_BASE}
        cp -r ../SRCSharpWeb/bin/web/wwwroot/. ${SRCWEB_ROOT}${SRCWEB_BASE}
        sed -i "s|<base href=\"/\" />|<base href=\"${SRCWEB_BASE}\" />|" ${SRCWEB_ROOT}${SRCWEB_BASE}index.html
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test tests/web.spec.js

    # 通った・やり直して通った（flaky）・失敗・飛ばしたテストの数と、flaky の一覧をサマリに出す
    - name: Summarize SRC#Web tests
      if: always()
      run: node .github/scripts/playwright-summary.mjs SRC.Sharp/SRCSharpWeb.E2E/test-results/results.json 'SRC#Web（Playwright）' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SRC#Web test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: srcweb-playwright
        path: |
          SRC.Sharp/SRCSharpWeb.E2E/playwright-report/
          SRC.Sharp/SRCSharpWeb.E2E/test-results/
        if-no-files-found: ignore

  # ブラウザで動く lint（SRCLintWeb。スレッドを使わない別の WebAssembly）。test-web と並べて動かし、待ち時間を減らす
  test-lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: SRC.Sharp/Directory.Packages.props

    - name: Build SRCLintWeb
      run: |
        dotnet workload install wasm-tools --skip-manifest-update
        dotnet publish SRC.Sharp/SRCLintWeb/SRCLintWeb.csproj -c Release -o SRC.Sharp/SRCLintWeb/bin/web

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # 配信のルートの /lint/ に置く（SRC#Site と同じ）。発行物が無ければ飛ばさずに落とす（SRCLINT_REQUIRED）
    - name: Test SRCLintWeb (Playwright)
      working-directory: SRC.Sharp/SRCSharpWeb.E2E
      env:
        SRCWEB_ROOT: ../SRCLintWeb/bin/pages-test
        SRCWEB_BASE: /lint/
        SRCLINT_REQUIRED: 1
      run: |
        mkdir -p ${SRCWEB_ROOT}/lint
        cp -r ../SRCLintWeb/bin/web/wwwroot/. ${SRCWEB_ROOT}/lint/
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test tests/lint.spec.js

    - name: Summarize SRCLintWeb tests
      if: always()
      run: node .github/scripts/playwright-summary.mjs SRC.Sharp/SRCSharpWeb.E2E/test-results/results.json 'SRCLintWeb（Playwright）' >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SRCLintWeb test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: srclint-playwright
        path: |
          SRC.Sharp/SRCSharpWeb.E2E/playwright-report/
          SRC.Sharp/SRCSharpWeb.E2E/test-results/
        if-no-files-found: ignore

  # 検証用のイメージ（koudenpa/srcdatalinter）。従来の lint と srcsharp（自動プレイ・バランス集計）が動くことを確かめる
  docker-srcdatalinter:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Build image
      run: docker build -f SRC.Sharp/SRCDataLinter/Dockerfile -t srcdatalinter:test .

    - name: Lint (従来の使い方)
      run: docker run --rm -v "$PWD/SRC.Sharp/E2E/sound:/app/data" srcdatalinter:test data

    - name: srcsharp lint / play / balance
      run: |
        cp -r SRC.Sharp/E2E/battle-basic /tmp/scenario
        docker run --rm -v /tmp/scenario:/scenario srcdatalinter:test lint /scenario/Data --format sarif --output /scenario/lint.sarif || true
        test -s /tmp/scenario/lint.sarif
        docker run --rm -v /tmp/scenario:/scenario srcdatalinter:test play /scenario/test.eve --script /scenario/play.txt --out /scenario/snapshots
        ls /tmp/scenario/snapshots
        docker run --rm -v /tmp/scenario:/scenario srcdatalinter:test balance /scenario/Data | tee /tmp/balance.md
        grep -q "テスト機" /tmp/balance.md

    - name: srcsharp help
      run: |
        docker run --rm srcdatalinter:test help Askコマンド | grep -q "Askコマンド"
        docker run --rm srcdatalinter:test help --search 選択肢を表示する | grep -q "Askコマンド"

  # Windows でしか確かめられないもの: ソリューション全体（WinForms の SRC#Form を含む）のビルドと発行、
  # SRCCore のユニットテスト（大文字・小文字を区別しないファイルシステムなど）、Windows の実フォントの寸法。
  # シナリオの E2E・VRT は Linux（test-srccore-linux）を正とし、ここでは動かさない（docs/testing.md）
  build-and-test-srcs:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet のパッケージをキャッシュする。版はすべて Directory.Packages.props にある（Central Package Management）
        cache: true
        cache-dependency-path: SRC.Sharp/Directory.Packages.props

    - name: Restore dependencies
      run: dotnet restore SRC.Sharp/SRC.Sharp.sln

    - name: Build
      run: dotnet build SRC.Sharp/SRC.Sharp.sln --no-restore

    - name: Test SRCCore
      run: dotnet test SRC.Sharp/SRCCoreTests/SRCCoreTests.csproj --no-build --verbosity normal

    # SkiaSharp のネイティブライブラリの読み込みと、Windows の実フォントで測った縦の寸法（WindowsFontMetrics の検証用）
    - name: Test SRCRender (Windows fonts)
      run: dotnet test SRC.Sharp/SRCRenderTests/SRCRenderTests.csproj --no-build --verbosity normal --filter "FullyQualifiedName~WindowsFontMetricsTests|FullyQualifiedName~SkiaFontsTests"

    - name: Upload font metrics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-font-metrics
        path: SRC.Sharp/SRCRenderTests/bin/**/TestResults/fontmetrics.txt
        if-no-files-found: ignore

    # Check NU1605 https://github.com/7474/SRC/pull/262
    - name: Try Publish
      run: dotnet publish SRC.Sharp/SRCSharpForm/SRCSharpForm.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false

  # SRC#Help（Jekyll）のビルド。配信は CD-swa-help.yml が行うが、Dependabot の PR では配信用のトークンが無く
  # ビルドもされないため、ここで確かめる。Static Web Apps（Oryx）と同じく、Ruby は SRC.Sharp.Help/.ruby-version の版で、
  # Gemfile.lock を固定せずに bundle install する（Gemfile.lock には Ruby 3.1 では入れられない版が含まれていて、
  # Oryx はそれを入れられる版に解決し直してビルドしている。docs/testing.md）
  build-help:
    needs: changes
    if: needs.changes.outputs.help == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SRC.Sharp.Help
    steps:
    - uses: actions/checkout@v7

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        working-directory: SRC.Sharp.Help

    - name: Build
      run: |
        bundle install
        bundle exec jekyll build

  # ブランチ保護の必須チェック。どれかのジョブが失敗・取り消しなら失敗する（省いたジョブは成功として扱う）
  ci-passed:
    if: always()
    needs: [changes, release-check, test-srccore-linux, test-tools-linux, test-web, test-lint, docker-srcdatalinter, build-and-test-srcs, build-help]
    runs-on: ubuntu-24.04
    steps:
    - name: Check results
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # カバレッジの計測（master への push のときだけ）。マージの可否には使わない。
  # 収集は後処理に数分かかるため、テストのジョブとは分けて動かす
  coverage:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
        # NuGet のパッケージをキャッシュする。版はすべて Directory.Packages.props にある（Central Package Management）
        cache: true
        cache-dependency-path: SRC.Sharp/Directory.Packages.props

    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont xvfb

    # テストの成否は test-srccore-linux で見るため、失敗しても計測を続ける
    - name: Test with coverage
      continue-on-error: true
      run: |
        dotnet test SRC.Sharp/SRCCoreTests/SRCCoreTests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults/core
        dotnet test SRC.Sharp/SRCRenderTests/SRCRenderTests.csproj --collect:"XPlat Code Coverage" --results-directory ./TestResults/render

    # シナリオ（E2E コーパス・画面テスト）でどれだけコマンドを実行できているかをジョブのサマリーに出す
    - name: Report command coverage of scenarios
      run: |
        files=$(find TestResults/render -name coverage.cobertura.xml)
        if [ -n "$files" ]; then
          python3 .github/scripts/command-coverage.py $files >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Generate Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
      with:
        reports: TestResults/**/coverage.cobertura.xml
        targetdir: CoverageReport
        reporttypes: Cobertura;MarkdownSummaryGithub

    - name: Upload Coverage Report to Summary
      run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    # SRCCore と SRCRender を合わせたカバレッジ
    - name: Send Coverage Summary to Mackerel (service metrics)
      env:
        MACKEREL_API_KEY: ${{ secrets.MACKEREL_API_KEY }}
      run: |
        line=$(python3 -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); print(round(float(r.get('line-rate'))*100,2))" CoverageReport/Cobertura.xml)
        branch=$(python3 -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); print(round(float(r.get('branch-rate'))*100,2))" CoverageReport/Cobertura.xml)
        echo "line=${line}% branch=${branch}%"
        now=$(date +%s)
        curl -sSf -X POST https://api.mackerelio.com/api/v0/services/SRCS/tsdb \
          -H "X-Api-Key: ${MACKEREL_API_KEY}" -H 'Content-Type: application/json' \
          -d "[{\"name\":\"srcs.coverage.line_rate_percent\",\"time\":${now},\"value\":${line}},{\"name\":\"srcs.coverage.branch_rate_percent\",\"time\":${now},\"value\":${branch}}]"

name: CI

on:
  push:
    branches: [ master ]
#     paths: 
#       - .github/workflows/CI.yml
#       - SRC.Sharp/**
  pull_request:
    branches: [ master ]
#     paths: 
#       - .github/workflows/CI.yml
#       - SRC.Sharp/**

jobs:
  # SRCCore / SRCRender がプラットフォーム非依存であることを確認する
  # （所要時間を縮めるため、ツール・SRC#Web は別のジョブで並べて動かす）
  test-srccore-linux:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # VRT の基準画像は Noto Sans CJK JP で作成している
    # MIDI の合成テストには SoundFont（TimGM6mb）、カーソル移動のテストには Xvfb を使う
    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont xvfb

    - name: Test SRCCore
      run: dotnet test SRC.Sharp/SRCCoreTests/SRCCoreTests.csproj --verbosity normal

    # カバレッジの収集は後処理に数分かかるため、master への push のときだけ行う
    - name: Test SRCRender (E2E / VRT)
      if: github.event_name != 'push'
      run: dotnet test SRC.Sharp/SRCRenderTests/SRCRenderTests.csproj --verbosity normal

    - name: Test SRCRender (E2E / VRT, with coverage)
      if: github.event_name == 'push'
      run: dotnet test SRC.Sharp/SRCRenderTests/SRCRenderTests.csproj --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./RenderCoverage

    # シナリオ（E2E コーパス・画面テスト）でどれだけコマンドを実行できているかをジョブのサマリーに出す
    - name: Report command coverage of scenarios
      if: always() && github.event_name == 'push'
      run: |
        files=$(find RenderCoverage -name coverage.cobertura.xml)
        if [ -n "$files" ]; then
          python3 .github/scripts/command-coverage.py $files >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: screenshots
        path: |
          SRC.Sharp/SRCRenderTests/bin/**/TestResults/vrt/
          SRC.Sharp/SRCRenderTests/bin/**/TestResults/e2e/
        if-no-files-found: ignore

  # SRC#Avalonia・作成支援ツール・SRCSound
  test-tools-linux:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont xvfb

    # マウスカーソルの移動（X11）を確かめるため Xvfb 上で実行する
    - name: Test SRC#Avalonia (headless)
      run: xvfb-run -a dotnet test SRC.Sharp/SRCSharpAvaloniaTests/SRCSharpAvaloniaTests.csproj --verbosity normal

    # 作成支援ツール（lint・解析・バランス集計・Language Server・デバッガ）
    - name: Test SRCAuthoring
      run: dotnet test SRC.Sharp/SRCAuthoringTests/SRCAuthoringTests.csproj --verbosity normal

    # 音声出力の無いランナーでは OpenAL Soft の null 出力を使う
    - name: Test SRCSound
      run: dotnet test SRC.Sharp/SRCSoundTests/SRCSoundTests.csproj --verbosity normal
      env:
        ALSOFT_DRIVERS: "null"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # VS Code 拡張（Language Server とデバッガのクライアント）。esbuild でまとめ、.vsix を作る
    - name: Build VS Code extension
      working-directory: SRC.Sharp/SRCSharpVSCode
      run: |
        # 拡張の版はライブラリ（srcsharp）の版と合わせる（docs/versioning.md）
        minor=$(sed -n 's:.*<SrcSharpVersionMinor>\(.*\)</SrcSharpVersionMinor>.*:\1:p' ../Directory.Build.props)
        patch=$(sed -n 's:.*<SrcSharpVersionPatch>\(.*\)</SrcSharpVersionPatch>.*:\1:p' ../Directory.Build.props)
        version=$(jq -r .version package.json)
        if [ "$version" != "0.$minor.$patch" ]; then
          echo "::error file=SRC.Sharp/SRCSharpVSCode/package.json::拡張の版 $version がライブラリの版 0.$minor.$patch と違います"
          exit 1
        fi
        npm ci
        npm run package

    - name: Upload VS Code extension
      uses: actions/upload-artifact@v7
      with:
        name: src-vscode-vsix
        path: SRC.Sharp/SRCSharpVSCode/*.vsix

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: screenshots-avalonia
        path: SRC.Sharp/SRCSharpAvaloniaTests/bin/**/TestResults/avalonia/
        if-no-files-found: ignore

  # SRC#Web（マルチスレッドの WebAssembly と SkiaSharp のネイティブライブラリのリンクに wasm-tools が必要）
  test-web:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install fonts
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

    # PR はインタープリターで発行して待ち時間を減らす（AOT は 8 分ほどかかる）。
    # master への push は公開するものと同じ AOT で発行し、E2E を通す（docs/gui/web.md）
    - name: Build SRC#Web
      run: |
        dotnet workload install wasm-tools
        dotnet publish SRC.Sharp/SRCSharpWeb/SRCSharpWeb.csproj -c Release -o SRC.Sharp/SRCSharpWeb/bin/web -p:RunAOTCompilation=${{ github.event_name == 'pull_request' && 'false' || 'true' }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # 発行した SRC#Web を GitHub Pages と同じくサブパス（/SRC/web/）に置いて配信し、Chromium でプレイする
    - name: Test SRC#Web (Playwright)
      working-directory: SRC.Sharp/SRCSharpWeb.E2E
      env:
        SRCWEB_ROOT: ../SRCSharpWeb/bin/pages-test
        SRCWEB_BASE: /SRC/web/
      run: |
        mkdir -p ${SRCWEB_ROOT}${SRCWEB_BASE}
        cp -r ../SRCSharpWeb/bin/web/wwwroot/. ${SRCWEB_ROOT}${SRCWEB_BASE}
        sed -i "s|<base href=\"/\" />|<base href=\"${SRCWEB_BASE}\" />|" ${SRCWEB_ROOT}${SRCWEB_BASE}index.html
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test

    - name: Upload SRC#Web test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: srcweb-playwright
        path: |
          SRC.Sharp/SRCSharpWeb.E2E/playwright-report/
          SRC.Sharp/SRCSharpWeb.E2E/test-results/
        if-no-files-found: ignore

  # 検証用のイメージ（koudenpa/srcdatalinter）。従来の lint と srcsharp（自動プレイ・バランス集計）が動くことを確かめる
  docker-srcdatalinter:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Build image
      run: docker build -f SRC.Sharp/SRCDataLinter/Dockerfile -t srcdatalinter:test .

    - name: Lint (従来の使い方)
      run: docker run --rm -v "$PWD/SRC.Sharp/E2E/sound:/app/data" srcdatalinter:test data

    - name: srcsharp lint / play / balance
      run: |
        cp -r SRC.Sharp/E2E/battle-basic /tmp/scenario
        docker run --rm -v /tmp/scenario:/scenario srcdatalinter:test lint /scenario/Data --format sarif --output /scenario/lint.sarif || true
        test -s /tmp/scenario/lint.sarif
        docker run --rm -v /tmp/scenario:/scenario srcdatalinter:test play /scenario/test.eve --script /scenario/play.txt --out /scenario/snapshots
        ls /tmp/scenario/snapshots
        docker run --rm -v /tmp/scenario:/scenario srcdatalinter:test balance /scenario/Data | tee /tmp/balance.md
        grep -q "テスト機" /tmp/balance.md

    - name: srcsharp help
      run: |
        docker run --rm srcdatalinter:test help Askコマンド | grep -q "Askコマンド"
        docker run --rm srcdatalinter:test help --search 選択肢を表示する | grep -q "Askコマンド"

  build-and-test-srcs:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore SRC.Sharp/SRC.Sharp.sln

    - name: Build
      run: dotnet build SRC.Sharp/SRC.Sharp.sln --no-restore

    - name: Test
      if: github.event_name == 'pull_request'
      run: dotnet test SRC.Sharp/SRC.Sharp.sln --no-build --verbosity normal

    - name: Test (with coverage)
      if: github.event_name == 'push'
      run: dotnet test SRC.Sharp/SRC.Sharp.sln --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./TestResults

    # Windows の実フォントで測った縦の寸法（SRCRender の WindowsFontMetrics の検証用）
    - name: Upload font metrics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-font-metrics
        path: SRC.Sharp/SRCRenderTests/bin/**/TestResults/fontmetrics.txt
        if-no-files-found: ignore

    - name: Generate Coverage Report
      if: github.event_name == 'push'
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.11
      with:
        reports: TestResults/**/coverage.cobertura.xml
        targetdir: CoverageReport
        reporttypes: MarkdownSummaryGithub

    - name: Upload Coverage Report to Summary
      if: github.event_name == 'push'
      run: cat CoverageReport/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY
      shell: pwsh

    - name: Upload coverage to Codecov
      if: github.event_name == 'push'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: TestResults/**/coverage.cobertura.xml
        fail_ci_if_error: true

    - name: Send Coverage Summary to Mackerel (service metrics)
      if: github.event_name == 'push'
      shell: pwsh
      env:
        MACKEREL_API_KEY: ${{ secrets.MACKEREL_API_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        $files = Get-ChildItem -Path TestResults -Recurse -Filter coverage.cobertura.xml -ErrorAction SilentlyContinue
        if (-not $files) {
          Write-Error "No coverage.cobertura.xml file found under TestResults."
          exit 1
        }
        $latest = $files | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        [xml]$xml = Get-Content $latest.FullName
        $lineRateAttr   = $xml.coverage.'line-rate'
        $branchRateAttr = $xml.coverage.'branch-rate'
        if ($null -eq $lineRateAttr)   { Write-Error "Missing 'line-rate' attribute in coverage XML.";   exit 1 }
        if ($null -eq $branchRateAttr) { Write-Error "Missing 'branch-rate' attribute in coverage XML."; exit 1 }
        $lineRate   = [math]::Round([double]$lineRateAttr   * 100, 2)
        $branchRate = [math]::Round([double]$branchRateAttr * 100, 2)
        $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
        $body = ConvertTo-Json @(
          @{ name = 'srcs.coverage.line_rate_percent';   time = $epoch; value = $lineRate },
          @{ name = 'srcs.coverage.branch_rate_percent'; time = $epoch; value = $branchRate }
        )
        Invoke-RestMethod -Method Post `
          -Uri 'https://api.mackerelio.com/api/v0/services/SRCS/tsdb' `
          -Headers @{ 'X-Api-Key' = $env:MACKEREL_API_KEY } `
          -ContentType 'application/json' `
          -Body $body

    # Check NU1605 https://github.com/7474/SRC/pull/262
    - name: Try Publish
      run: dotnet publish SRC.Sharp/SRCSharpForm/SRCSharpForm.csproj -c Release -r win-x64 -p:PublishSingleFile=true --self-contained false

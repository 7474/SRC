name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PUBLISH_DIR: SRC.Sharp/SRCDataViewer/bin/Release/net10.0/publish/wwwroot
  # SRC#Web（ブラウザ版）は同じサイトの web/ に置く
  WEB_PUBLISH_DIR: SRC.Sharp/SRCSharpWeb/bin/pages

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build project
        run: dotnet publish SRC.Sharp/SRCDataViewer/SRCDataViewer.csproj -c Release

      # マルチスレッドの WebAssembly と SkiaSharp のネイティブライブラリのリンクに wasm-tools が必要
      - name: Build SRC#Web
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet publish SRC.Sharp/SRCSharpWeb/SRCSharpWeb.csproj -c Release -o ${{ env.WEB_PUBLISH_DIR }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Replace index.html with GitHub Pages version
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "Pages base path: ${BASE_PATH}"
          cp ${{ env.PUBLISH_DIR }}/index.ghp.html ${{ env.PUBLISH_DIR }}/index.html
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}/\" />|" ${{ env.PUBLISH_DIR }}/index.html

      - name: Place SRC#Web under web/
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p ${{ env.PUBLISH_DIR }}/web
          cp -r ${{ env.WEB_PUBLISH_DIR }}/wwwroot/. ${{ env.PUBLISH_DIR }}/web/
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}/web/\" />|" ${{ env.PUBLISH_DIR }}/web/index.html
          grep -n "<base href" ${{ env.PUBLISH_DIR }}/web/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


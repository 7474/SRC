name: Publish SRC#Avalonia

# SRC#Avalonia（Windows・macOS・Linux）を OS ごとの zip にして GitHub Release に添付する。
# - タグ（v*）の push: そのタグのリリースに添付する（Publish-Package.yml と同じタグ）
# - 手動実行: 既存のリリース（tag）に添付する。過去のリリースに後から加えるとき用
# .NET を入れなくても動くよう、自己完結の単一ファイルにする。
# https://learn.microsoft.com/dotnet/core/deploying/single-file/overview

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '添付するリリースのタグ（例: v3.5.1）'
        type: string
        required: true

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # タグで動くときは、タグと版・リリースの案内が揃っているかを確かめてから添付する（Publish-Package.yml と同じ）
      - name: Check version
        if: github.event_name == 'push'
        run: python3 tools/release.py check --tag "$TAG"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # 作り方は master への push ごとに確かめているものと同じ（Packages.yml）。
      # 手動で過去のタグに添付するときもこのワークフローの版の手順を使うため、スクリプトは別に取り出す
      - uses: actions/checkout@v7
        with:
          path: .ci
          sparse-checkout: .github/scripts

      - name: Publish
        run: .ci/.github/scripts/publish-avalonia.sh ${{ matrix.rid }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: SRCSharpAvalonia-${{ matrix.rid }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: SRC#DataViewer CI/CD

# データビューアと SRC#Web（web/）を Azure Static Web Apps に配信する。pull request ではプレビュー環境に配信する

on:
  push:
    branches:
      - master
    paths: 
      - .github/workflows/CD-swa-dataviewer.yml
      - SRC.Sharp/**
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
    paths: 
      - .github/workflows/CD-swa-dataviewer.yml
      - SRC.Sharp/**

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build and Deploy Job    
    environment:
      name: ${{ (github.event_name == 'push' && 'SRC#DataViewer') || 'SRC#DataViewer dev' }}
      url: ${{ (github.event_name == 'push' && 'https://srcv.7474.jp/') || steps.builddeploy.outputs.static_web_app_url }}
    outputs:
      static_web_app_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    env:
      # Dependabot やフォークからの PR では Actions のシークレットが渡されず空になる。そのときはビルドだけ確かめて配信しない
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_COAST_005428600 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # データビューア（SRCTestBlazor）をサイトのルートに、SRC#Web（SRCSharpWeb）を web/ に置く。
      # SRC#Web はマルチスレッドの WebAssembly と SkiaSharp のネイティブライブラリのリンクに wasm-tools が必要。
      # PR のプレビューは確認用なので AOT を切って早く出す。master（本番）は AOT（docs/gui/web.md）
      - name: Build
        run: |
          dotnet workload install wasm-tools
          dotnet publish SRC.Sharp/SRCTestBlazor/SRCTestBlazor.csproj -c Release -o out/dataviewer
          dotnet publish SRC.Sharp/SRCSharpWeb/SRCSharpWeb.csproj -c Release -o out/web -p:RunAOTCompilation=${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          mkdir -p site
          cp -r out/dataviewer/wwwroot/. site/
          mkdir -p site/web
          cp -r out/web/wwwroot/. site/web/
          sed -i 's|<base href="/" />|<base href="/web/" />|' site/web/index.html
          # 発行時に作られた圧縮版（.br・.gz）は書き換える前の内容のため消す。Static Web Apps は圧縮版があればそちらを返す
          rm -f site/web/index.html.br site/web/index.html.gz
          grep -n "<base href" site/web/index.html
          du -sh site site/web

      # クロスオリジン分離のヘッダ（web/ のみ）は staticwebapp.config.json で付ける
      - name: Build And Deploy
        id: builddeploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'site'
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Skip Deploy
        if: env.SWA_TOKEN == ''
        run: echo "::notice::デプロイ用のトークンが渡されていない（Dependabot やフォークからの PR）ため、プレビュー環境への配信と E2E を省きます"

  e2e:
    # 配信しなかったとき（デプロイ用のトークンが無いとき）は確かめる先が無いので省く
    if: needs.build_and_deploy_job.outputs.static_web_app_url != ''
    runs-on: ubuntu-24.04
    needs: build_and_deploy_job
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - run: npm ci
        working-directory: ./SRC.Sharp/SRCTestBlazor/E2E
      # 配信した頁を開き、データビューアがデータを読み込めるか確かめる（結果は外部のサービスに送らない）
      - name: Cypress run
        working-directory: ./SRC.Sharp/SRCTestBlazor/E2E
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: ${{ needs.build_and_deploy_job.outputs.static_web_app_url }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    environment:
      name: 'SRC#DataViewer dev'
      url: ''
    env:
      # Dependabot が閉じたときなどトークンが無いときは閉じられない。残った環境は CD-swa-cleanup-previews.yml が閉じる
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_COAST_005428600 }}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: 'close'

name: SWA preview cleanup

# Static Web Apps のプレビュー環境（PR ごとの環境）のうち、PR がクローズ済みなのに残っているものを閉じる。
# プレビュー環境の数には上限があり、残っていると新しい PR のデプロイが
# 「maximum number of staging environments」で失敗するため。
#
# PR を閉じたときの Close Pull Request Job と同じく、デプロイ用のトークンで StaticSitesClient の close を実行する。
# Azure/static-web-apps-deploy は実行中のイベントの PR を閉じるため、ここでは同じイメージを直接動かし、
# 閉じる PR のイベントを渡す（Azure への追加の認証情報は不要）。
# Docker を使うため ubuntu-slim（非特権のコンテナ）ではなく ubuntu-24.04 で動かす。

on:
  schedule:
    - cron: '17 18 * * *' # 毎日 03:17 JST
  workflow_dispatch:
    inputs:
      pull_requests:
        description: '閉じる PR の番号（空白区切り）。空なら直近に閉じた PR'
        type: string
        default: ''
      days:
        description: '何日前までに閉じた PR を対象にするか'
        type: number
        default: 30
  # このワークフローを変えた PR でも動かして確かめる（閉じるのはクローズ済みの PR の環境だけ）
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/CD-swa-cleanup-previews.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Close preview environments of closed pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUESTS: ${{ inputs.pull_requests }}
          DAYS: ${{ inputs.days || 30 }}
          # アプリごとのデプロイ用トークン（CD-swa-dataviewer.yml・CD-swa-help.yml と同じもの）
          TOKEN_DATAVIEWER: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_COAST_005428600 }}
          TOKEN_HELP: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_PEBBLE_0DDB1C400 }}
        run: |
          set -uo pipefail
          image=mcr.microsoft.com/appsvc/staticappsclient:stable
          docker pull -q "$image"

          if [ -z "$PULL_REQUESTS" ]; then
            since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PULL_REQUESTS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state closed --base master --limit 200 \
              --json number,closedAt -q ".[] | select(.closedAt >= \"$since\") | .number" | tr '\n' ' ')
          fi
          echo "対象の PR: $PULL_REQUESTS"

          failed=0
          for pr in $PULL_REQUESTS; do
            # PR を閉じたときのイベントと同じ形のペイロード。StaticSitesClient は repository.html_url と
            # pull_request の number・title・head.ref・base.ref を読む（無いとイベントを読めず PR を特定できない）
            gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json number,title,headRefName,baseRefName,headRefOid \
              | jq --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                '{action: "closed", number: .number, repository: {html_url: $url}, pull_request: {number: .number, title: .title, state: "closed", head: {ref: .headRefName, sha: .headRefOid, repo: {fork: false}}, base: {ref: .baseRefName}}}' \
              > "$RUNNER_TEMP/event.json"
            head_ref=$(jq -r .pull_request.head.ref "$RUNNER_TEMP/event.json")
            for app in DATAVIEWER HELP; do
              token_var="TOKEN_$app"
              echo "::group::PR #$pr $app"
              docker run --rm \
                -v "$RUNNER_TEMP/event.json:/github/workflow/event.json:ro" \
                -e INPUT_ACTION=close \
                -e INPUT_AZURE_STATIC_WEB_APPS_API_TOKEN="${!token_var}" \
                -e GITHUB_ACTIONS=true \
                -e GITHUB_EVENT_NAME=pull_request \
                -e GITHUB_EVENT_PATH=/github/workflow/event.json \
                -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL -e GITHUB_RUN_ID \
                -e GITHUB_REF="refs/pull/$pr/merge" -e GITHUB_HEAD_REF="$head_ref" -e GITHUB_BASE_REF=master \
                "$image" sh -c 'cd /bin/staticsites && ./StaticSitesClient close' \
                || { echo "::warning::PR #$pr の $app のプレビュー環境を閉じられませんでした（既に無い場合も含む）"; failed=$((failed + 1)); }
              echo "::endgroup::"
            done
          done
          echo "閉じられなかったもの: $failed"

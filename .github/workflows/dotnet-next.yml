name: .NET next

# 次の .NET（いまは .NET 11）でビルド・テストできるかを確かめる（docs/dotnet-upgrade.md）。
# -p:SrcSharpTargetFramework=net11.0 で、アプリ・ツール・テストのターゲットを切り替える（SRC.Sharp/Directory.Build.props）。
# 必須チェック（CI の ci-passed）には入れない。.NET 11 に上げたら、このワークフローは次の .NET 用にするか消す

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜（UTC）。プレビュー・RC の SDK と依存の版の更新に追いつけているかを見る
    - cron: '17 20 * * 1'
  pull_request:
    branches: [ master ]
    paths:
      - 'SRC.Sharp/Directory.Build.props'
      - 'SRC.Sharp/Directory.Packages.props'
      - '.github/workflows/dotnet-next.yml'

permissions:
  contents: read

env:
  DOTNET_NEXT_TFM: net11.0

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview

    - name: Install fonts and SoundFont
      run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk timgm6mb-soundfont xvfb

    # SRC#Form（Windows 向け）も Linux でビルドだけする
    - name: Build solution
      run: dotnet build SRC.Sharp/SRC.Sharp.sln -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }} -p:EnableWindowsTargeting=true

    - name: Test SRCCore
      run: dotnet test SRC.Sharp/SRCCoreTests/SRCCoreTests.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}

    - name: Test SRCRender (E2E / VRT)
      run: dotnet test SRC.Sharp/SRCRenderTests/SRCRenderTests.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}

    - name: Test SRC#Avalonia (headless)
      run: xvfb-run -a dotnet test SRC.Sharp/SRCSharpAvaloniaTests/SRCSharpAvaloniaTests.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}

    - name: Test authoring tools and SRCSound
      run: |
        dotnet test SRC.Sharp/SRCAuthoringTests/SRCAuthoringTests.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}
        dotnet test SRC.Sharp/SRCSoundTests/SRCSoundTests.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}

    - name: Test SRC#Web (unit)
      run: dotnet test SRC.Sharp/SRCSharpWebTests/SRCSharpWebTests.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}

    # SRC#Web・SRCLintWeb はソリューションに入っていない。SRC#Web はマルチスレッドの WebAssembly と SkiaSharp のリンクに wasm-tools が要る
    - name: Publish SRC#Web and SRCLintWeb
      run: |
        dotnet workload install wasm-tools --skip-manifest-update
        dotnet publish SRC.Sharp/SRCSharpWeb/SRCSharpWeb.csproj -c Release -o SRC.Sharp/SRCSharpWeb/bin/web -p:RunAOTCompilation=false -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}
        dotnet build SRC.Sharp/SRCLintWeb/SRCLintWeb.csproj -p:SrcSharpTargetFramework=${{ env.DOTNET_NEXT_TFM }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    # CI の test-web と同じく、発行した SRC#Web をサブパスに置いて Chromium でプレイする
    - name: Test SRC#Web (Playwright)
      working-directory: SRC.Sharp/SRCSharpWeb.E2E
      env:
        SRCWEB_ROOT: ../SRCSharpWeb/bin/pages-test
        SRCWEB_BASE: /SRC/web/
        PW_WORKERS: 2
      run: |
        mkdir -p ${SRCWEB_ROOT}${SRCWEB_BASE}
        cp -r ../SRCSharpWeb/bin/web/wwwroot/. ${SRCWEB_ROOT}${SRCWEB_BASE}
        sed -i "s|<base href=\"/\" />|<base href=\"${SRCWEB_BASE}\" />|" ${SRCWEB_ROOT}${SRCWEB_BASE}index.html
        npm ci
        npx playwright install --with-deps chromium
        npx playwright test tests/web.spec.js

    - name: Upload SRC#Web test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dotnet-next-srcweb-playwright
        path: |
          SRC.Sharp/SRCSharpWeb.E2E/playwright-report/
          SRC.Sharp/SRCSharpWeb.E2E/test-results/
        if-no-files-found: ignore

name: SRC#Help CI/CD

on:
  push:
    branches:
      - master
    paths: 
      - .github/workflows/CD-swa-help.yml
      - SRC.Sharp.Help/**
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
    paths: 
      - .github/workflows/CD-swa-help.yml
      - SRC.Sharp.Help/**

# 本番は 1 つずつ（待っているものは最新だけ残る）、PR は同じ PR の古い実行を取り消して動かす（CD-swa-dataviewer.yml と同じ）
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'production' || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-24.04
    name: Build and Deploy Job
    environment:
      name: ${{ (github.event_name == 'push' && 'SRC#Help') || 'SRC#Help dev' }}
      url: ${{ (github.event_name == 'push' && 'https://srch.7474.jp/') || steps.builddeploy.outputs.static_web_app_url }}
    env:
      # Dependabot やフォークからの PR では Actions のシークレットが渡されず空になる。そのときは配信しない
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_PEBBLE_0DDB1C400 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Jekyll はここで組み立て、組み立てた頁を Static Web Apps に送る（skip_app_build）。
      # Static Web Apps の組み立て（Oryx）が使える Ruby は 3.1 までで、保守の終わった版になるため（docs/testing.md）。
      # Ruby の版は SRC.Sharp.Help/.ruby-version、Gem の版は Gemfile.lock のとおりに入れる
      - name: Setup Ruby
        if: env.SWA_TOKEN != ''
        uses: ruby/setup-ruby@v1
        with:
          working-directory: SRC.Sharp.Help
          bundler-cache: true
      - name: Build
        if: env.SWA_TOKEN != ''
        working-directory: SRC.Sharp.Help
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Deploy
        id: builddeploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          app_location: "/SRC.Sharp.Help/_site"
          api_location: ""
          output_location: ""
          skip_app_build: true
      - name: Skip Deploy
        if: env.SWA_TOKEN == ''
        run: echo "::notice::デプロイ用のトークンが渡されていない（Dependabot やフォークからの PR）ため、プレビュー環境への配信を省きます"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    name: Close Pull Request Job
    environment:
      name: 'SRC#Help dev'
      url: ''
    env:
      # Dependabot が閉じたときなどトークンが無いときは閉じられない。残った環境は CD-swa-cleanup-previews.yml が閉じる
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_PEBBLE_0DDB1C400 }}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: "close"

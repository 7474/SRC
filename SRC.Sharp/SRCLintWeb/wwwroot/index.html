<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRC# lint</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    table { border-collapse: collapse; margin-top: 1rem; }
    td, th { border: 1px solid #ccc; padding: .25rem .5rem; text-align: left; }
    .error { color: #b00; }
  </style>
</head>
<body>
  <h1>SRC# lint</h1>
  <p>シナリオの zip を選ぶと、ブラウザの中で srcsharp lint と同じ検査をします（ファイルはどこにも送りません）。</p>
  <input type="file" id="zip" accept=".zip,application/zip">
  <p id="status" aria-live="polite"></p>
  <table id="result" hidden>
    <thead><tr><th>ファイル</th><th>行</th><th>種類</th><th>内容</th></tr></thead>
    <tbody></tbody>
  </table>
  <script type="module">
    import { lintZip, preload } from './srclint.js';
    const status = document.getElementById('status');
    const table = document.getElementById('result');
    preload();
    document.getElementById('zip').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = '検査しています…';
      table.hidden = true;
      try {
        const r = await lintZip(file);
        status.textContent = `${r.checkedFiles} ファイルを検査、問題 ${r.diagnostics.length} 件`;
        const body = table.tBodies[0];
        body.replaceChildren(...r.diagnostics.map(d => {
          const tr = document.createElement('tr');
          tr.className = d.severity;
          for (const v of [d.file, d.line, d.severity === 'error' ? 'エラー' : '警告', d.message]) {
            tr.appendChild(document.createElement('td')).textContent = String(v);
          }
          return tr;
        }));
        table.hidden = r.diagnostics.length === 0;
      } catch (err) {
        status.textContent = String(err.message || err);
      }
    });
  </script>
</body>
</html>

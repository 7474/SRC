<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRC#Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <link rel="stylesheet" href="css/app.css" />
    <!-- GitHub Pages などヘッダを設定できない静的ホスティングで、クロスオリジン分離（SharedArrayBuffer）を有効にする -->
    <script src="coi-serviceworker.js"></script>
    <script src="js/store.js"></script>
</head>

<body>
    <div id="app">
        <main>
            <h1>SRC#Web</h1>
            <p class="status" id="boot">読み込み中…</p>
        </main>
    </div>

    <div id="blazor-error-ui">
        <span id="error-text">エラーが発生しました。</span>
        <a href="." class="reload">再読み込み</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // .NET が動く前の文言。表示言語は WebLocalization.cs と同じく localStorage の srcweb.language で選ぶ
        // （未設定・ja は日本語、en は英語、auto はブラウザの言語）
        const bootText = (() => {
            let setting = '';
            try {
                setting = (localStorage.getItem('srcweb.language') ?? '').trim().toLowerCase();
            } catch {
                // localStorage を使えない
            }
            const en = setting === 'en' || (setting === 'auto' && !(navigator.language ?? '').toLowerCase().startsWith('ja'));
            const text = en ? {
                loading: 'Loading…',
                unsupported: 'This browser is not supported (Service Worker and SharedArrayBuffer are required).',
                preparing: 'Preparing… (the page reloads automatically the first time)',
                error: 'An error has occurred.',
                reload: 'Reload',
            } : {
                loading: '読み込み中…',
                unsupported: 'このブラウザでは動作しません（Service Worker と SharedArrayBuffer が必要です）。',
                preparing: '準備しています…（初回は自動で再読み込みします）',
                error: 'エラーが発生しました。',
                reload: '再読み込み',
            };
            if (en) {
                document.documentElement.lang = 'en';
                document.getElementById('boot').textContent = text.loading;
                document.getElementById('error-text').textContent = text.error;
                document.querySelector('#blazor-error-ui .reload').textContent = text.reload;
            }
            return text;
        })();
        // マルチスレッドの .NET はクロスオリジン分離が必要。coi-serviceworker が有効になる（再読み込みされる）まで起動しない
        if (self.crossOriginIsolated) {
            Blazor.start();
        } else if (!window.isSecureContext || !('serviceWorker' in navigator)) {
            document.getElementById('boot').textContent = bootText.unsupported;
        } else {
            document.getElementById('boot').textContent = bootText.preparing;
        }
    </script>
</body>

</html>

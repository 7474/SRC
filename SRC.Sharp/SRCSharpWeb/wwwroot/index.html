<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SRC#Web</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <link rel="stylesheet" href="css/app.css" />
    <!-- GitHub Pages などヘッダを設定できない静的ホスティングで、クロスオリジン分離（SharedArrayBuffer）を有効にする -->
    <script src="coi-serviceworker.js"></script>
    <script src="js/store.js"></script>
</head>

<body>
    <div id="app">
        <main>
            <h1>SRC#Web</h1>
            <p class="status" id="boot">読み込み中…</p>
        </main>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。
        <a href="." class="reload">再読み込み</a>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // マルチスレッドの .NET はクロスオリジン分離が必要。coi-serviceworker が有効になる（再読み込みされる）まで起動しない
        if (self.crossOriginIsolated) {
            Blazor.start();
        } else if (!window.isSecureContext || !('serviceWorker' in navigator)) {
            document.getElementById('boot').textContent = 'このブラウザでは動作しません（Service Worker と SharedArrayBuffer が必要です）。';
        } else {
            document.getElementById('boot').textContent = '準備しています…（初回は自動で再読み込みします）';
        }
    </script>
</body>

</html>

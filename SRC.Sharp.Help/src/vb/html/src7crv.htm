<P><A NAME="1kdtmdk"></A></P>

<P><B>アンインストール</B></P>

<P>SRCはシステムフォルダへのファイルのコピーやレジストリへの書き込みを行っていません。</P>

<P>アンインストールするにはSRCのフォルダを丸ごと削除するだけで結構です。</P>

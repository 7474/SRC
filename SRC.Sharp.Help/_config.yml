title: SRC#Help
lang: ja-jp
email: koudenpa@hotmail.com
description: >- # this means to ignore newlines until "baseurl:"
  SRC#（SRCシャープ）のヘルプページ
baseurl: ""
# url: "https://srch.7474.jp"
twitter_username: koudenpa
github_username: 7474

# Build settings
source: src
theme: just-the-docs
search_enabled: true
gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub.
gh_edit_repository: https://github.com/7474/SRC
gh_edit_branch: master
gh_edit_source: SRC.Sharp.Help/src
gh_edit_view_mode: edit

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

markdown_ext: "md"
markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
  auto_ids: true

permalink: pretty
encoding: UTF-8


# テーマ（just-the-docs）の SCSS が、Dart Sass 3.0 で無くなる書き方（@import・グローバルな組み込み関数・
# darken()/lighten()）を使っていて、組み立てのたびに 60 件の非推奨の警告が出る。テーマの側で直るまで出さない。
# テーマを上げたときは、この行を外して警告が消えたかを確かめる
# https://github.com/jekyll/jekyll-sass-converter#sass-and-scss
sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
